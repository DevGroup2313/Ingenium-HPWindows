#
# Builds Ingenium for Windows on GitHub's own Windows computer, so nothing has
# to be installed or built on your PC. It runs by itself whenever something is
# uploaded to the repository, and by hand from the Actions tab ("Build Carpe
# Diem for Windows", "Run workflow"). Two downloads are placed on the Releases
# page and under "Artifacts" on the run's page:
#   Carpe-Diem-<build>-Windows-Setup.exe  the installer, made the way Inkwell's
#       is: Ingenium as a folder, installed for you only (no administrator),
#       with Start menu and Desktop shortcuts and an uninstaller. It should open
#       sooner than the single file, because nothing is unpacked at each start.
#   Carpe-Diem-Windows.zip  the portable single Ingenium.exe, for a USB stick.
# Both use the same folder for your work, %LOCALAPPDATA%\CarpeDiem\storage.

name: Build Ingenium for Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get the project
        uses: actions/checkout@v5

      - name: Find the project folder
        run: |
          $f = Get-ChildItem -Recurse -Filter carpe_diem.spec | Where-Object { $_.FullName -notmatch '\\.git\\' } | Select-Object -First 1
          if (-not $f) { Write-Error "carpe_diem.spec not found. Upload the CONTENTS of the Windows project folder."; exit 1 }
          "PROJ=$($f.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Project folder: $($f.DirectoryName)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the build tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyinstaller pywebview pythonnet
          python -m pip list | Select-String -Pattern "pyinstaller|pywebview|pythonnet"

      - name: Read the clipboard as the app's Paste does
        # build 1048: the page's right-click Paste asks the app for the clipboard, so a link
        # copied anywhere in Windows can be pasted without the keyboard. Checked on real Windows.
        run: |
          Set-Location $env:PROJ
          Set-Clipboard -Value 'Carpe 1048, copied outside the app: https://example.org/x'
          python -c "import carpe_diem_app as a; r = a.read_clipboard(); print(r); assert 'copied outside the app' in r['text']"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Ingenium.exe
        run: |
          Set-Location $env:PROJ
          python -m PyInstaller --noconfirm --clean carpe_diem.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-log.txt"
          if (-not (Test-Path "dist\Ingenium.exe")) { Write-Error "No exe was produced."; exit 1 }
          Get-Item "dist\Ingenium.exe" | Format-List Name, Length

      - name: If the build failed, show why
        if: failure()
        run: Get-Content "$env:RUNNER_TEMP\build-log.txt" -Tail 80

      - name: Open the app once
        # Starts the finished exe for 30 seconds and reads its own log.
        run: |
          Set-Location "$env:PROJ\dist"
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\Ingenium.exe" -PassThru
          Start-Sleep -Seconds 30
          try {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\shots\windows.png")
            "Screenshot taken."
          } catch { "No screenshot: $($_.Exception.Message)" }
          $alive = -not $p.HasExited
          if ($alive) { "Still running after 30 seconds."; Stop-Process -Id $p.Id -Force } else { "EXITED EARLY with code $($p.ExitCode)" }
          "--- what the app recorded ---"
          if (Test-Path carpe_diem_crash.log) { Get-Content carpe_diem_crash.log } else { "(nothing)" }
          if ((Test-Path carpe_diem_crash.log) -and (Select-String -Path carpe_diem_crash.log -Pattern "Traceback" -Quiet)) { Write-Error "A fault was recorded."; exit 1 }
          if (-not $alive) { exit 1 }
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue

      - name: Keep the screenshot with this run
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-screenshot
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - name: Check the app file inside is the one committed
        run: |
          python -c "import hashlib,sys; from PyInstaller.archive.readers import CArchiveReader as R; d=R(r'$env:PROJ\dist\Ingenium.exe').extract('carpe_diem.html'); s=open(r'$env:PROJ\carpe_diem.html','rb').read(); print('inside', hashlib.md5(d).hexdigest(), 'committed', hashlib.md5(s).hexdigest(), 'CRLF inside', d.count(b'\r\n')); sys.exit(0 if d==s and d.count(b'\r\n')==0 else 1)"

      - name: Build the installed version (a folder, as Inkwell's)
        run: |
          Set-Location $env:PROJ
          python -m PyInstaller --noconfirm --clean --distpath dist_installed carpe_diem_onedir.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-onedir-log.txt"
          if (-not (Test-Path "dist_installed\Ingenium\Ingenium.exe")) { Get-Content "$env:RUNNER_TEMP\build-onedir-log.txt" -Tail 60; Write-Error "No folder build was produced."; exit 1 }
          Get-ChildItem "dist_installed\Ingenium" | Format-Table Name, Length

      - name: Open the folder version once
        run: |
          Set-Location "$env:PROJ\dist_installed\Ingenium"
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath ".\Ingenium.exe" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { "Still running after 25 seconds."; Stop-Process -Id $p.Id -Force } else { "EXITED EARLY with code $($p.ExitCode)" }
          "--- what the app recorded ---"
          if (Test-Path carpe_diem_crash.log) { Get-Content carpe_diem_crash.log } else { "(nothing)" }
          if ((Test-Path carpe_diem_crash.log) -and (Select-String -Path carpe_diem_crash.log -Pattern "Traceback" -Quiet)) { Write-Error "A fault was recorded."; exit 1 }
          if (-not $alive) { exit 1 }
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue

      - name: Make the installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup could not be found or installed."; exit 1 }
          $pass = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          & $iscc /Qp "/DAppVersion=$pass" "/DSourceDir=$env:PROJ\dist_installed\Ingenium" "/DOutputDir=$env:GITHUB_WORKSPACE\out" "$env:PROJ\build\carpe_diem.iss"
          $setup = "Carpe-Diem-$pass-Windows-Setup.exe"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\out\$setup")) { Write-Error "No installer was made."; exit 1 }
          "SETUP_NAME=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item "$env:GITHUB_WORKSPACE\out\$setup" | Format-List Name, Length

      - name: Install, open, and uninstall it, as a person would
        run: |
          $setup = "$env:GITHUB_WORKSPACE\out\$env:SETUP_NAME"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Ingenium"
          $store = Join-Path $env:LOCALAPPDATA "CarpeDiem\storage"
          New-Item -ItemType Directory -Force -Path $store | Out-Null
          Set-Content -Path (Join-Path $store "keep-me.txt") -Value "work that must survive"
          $i = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -PassThru -Wait
          "installer exit code: $($i.ExitCode)"
          if (-not (Test-Path "$app\Ingenium.exe")) { Write-Error "The installer did not put Ingenium.exe in $app"; exit 1 }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) "Ingenium.lnk"
          "Start menu shortcut: $(Test-Path $lnk)"
          "Desktop shortcut: $(Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Ingenium.lnk'))"
          $bk = Get-ChildItem (Join-Path $env:LOCALAPPDATA "CarpeDiem\backups") -Directory -ErrorAction SilentlyContinue
          "safety copies before install: $(@($bk).Count)"
          $p = Start-Process -FilePath "$app\Ingenium.exe" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { "The installed Ingenium is running."; Stop-Process -Id $p.Id -Force } else { "EXITED EARLY with code $($p.ExitCode)" }
          if (Test-Path "$app\carpe_diem_crash.log") { Get-Content "$app\carpe_diem_crash.log" }
          if (-not $alive) { exit 1 }
          Start-Sleep -Seconds 2
          $u = Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          # the uninstaller hands its work to a copy of itself, so wait until the program is gone
          for ($k = 0; $k -lt 60 -and (Test-Path "$app\Ingenium.exe"); $k++) { Start-Sleep -Seconds 1 }
          "uninstaller exit code: $($u.ExitCode)"
          if (Test-Path "$app\Ingenium.exe") { Write-Error "Uninstalling left the program behind."; exit 1 }
          if (-not (Test-Path (Join-Path $store "keep-me.txt"))) { Write-Error "Uninstalling touched the work folder."; exit 1 }
          "Uninstalled cleanly; the work folder is untouched."

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v6
        with:
          name: carpe-diem-windows-setup
          path: out/${{ env.SETUP_NAME }}
          if-no-files-found: error

      - name: Pack the app
        run: |
          Compress-Archive -Path "$env:PROJ\dist\Ingenium.exe" -DestinationPath "$env:GITHUB_WORKSPACE\Carpe-Diem-Windows.zip" -Force
          Get-Item "$env:GITHUB_WORKSPACE\Carpe-Diem-Windows.zip" | Format-List Name, Length

      - name: Keep the app with this run
        uses: actions/upload-artifact@v6
        with:
          name: carpe-diem-windows
          path: Carpe-Diem-Windows.zip
          if-no-files-found: error

      - name: Put the app on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "carpe-diem-windows"
          $pass = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          $notes = "Ingenium for Windows, build $pass. Built $((Get-Date).ToUniversalTime().ToString('dd MMMM yyyy, HH:mm')) UTC from branch $env:GITHUB_REF_NAME, commit $($env:GITHUB_SHA.Substring(0,7)). RECOMMENDED: download $env:SETUP_NAME and open it. It installs Ingenium for you only, with no administrator password, adds it to the Start menu (and the Desktop if you tick it), and should open sooner than the single file, because nothing is unpacked at each start. Python is not needed. If Windows SmartScreen says it protected your PC, choose More info, then Run anyway (the installer is not signed with a paid certificate). To remove it: Settings, Apps, Ingenium, Uninstall; your work stays. For a USB stick instead: Carpe-Diem-Windows.zip holds the portable Ingenium.exe. Both open the same work."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Carpe-Diem-Windows.zip "out/$env:SETUP_NAME" --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag Carpe-Diem-Windows.zip "out/$env:SETUP_NAME" --target $env:GITHUB_SHA --title "Ingenium for Windows" --notes $notes
          }
